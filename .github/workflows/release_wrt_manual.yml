name: Manual Release WRT
run-name: Manual Release WRT

on:
  # schedule:
  #   - cron: "0 4 * * 5"
  workflow_dispatch: 
    inputs:
      model:
        type: choice
        description: 'Model to release'
        required: true
        default: lk_x86_64_immwrt
        options:
          - lk_x86_64_immwrt
          - lk_x86_64_immwrt_mini
          - lk_x86_64-v3_immwrt
          - lk_mediatek_immwrt
          - lk_mediatek_immwrt_mini
          - lk_mt798x_7986_rebase
          - lk_mt798x_7986_k6.6
          - lk_mt798x_7986_rebase_mini
          - lk_mt798x_7986_k6.6_mini
          - lk_mt798x_7981_rebase_mini
          - lk_mt798x_7981_k6.6_mini
          - lk_ipq60xx_immwrt
          - lk_ipq60xx_immwrt_mini
          - lk_ipq60xx_libwrt
          - lk_ipq60xx_libwrt_mini
          - lk_ipq807x_libwrt
          - lk_ipq807x_libwrt_mini
          - lk_ipq60xx_qosmio
          - lk_ipq60xx_qosmio_mini
          - lk_ipq807x_qosmio
          - lk_ipq807x_qosmio_mini

permissions:
  actions: write
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release_wrt.yml
    with:
      model: ${{ github.event.inputs.model }}
    secrets: inherit
